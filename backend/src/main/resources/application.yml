# 앱 고유 설정. 운영 중 바뀔 수 있는 값을 코드에서 제외
# 길이 제한처럼 DB 스키마와 짝인 값은 여기가 아니라 FieldLengths 상수에 둬야함
lonelytracker:
  user:
    # 인증이 붙기 전까지 현재 사용자로 취급할 계정.
    # V4 마이그레이션이 만들어 둔 이름과 같아야 한다.
    default-username: default
    # 가입 시 미리 넣어주는 카테고리. 기획서와 일일 기록이 쓰는 네 축.
    recommended-categories:
      - 육체
      - 정신
      - 능력
      - 취미

  # LLM 연동. API 키는 여기 없고 사용자별로 갖는다.
  # 여기 남는 것은 사용자와 무관한 인프라 설정뿐이다.
  # 사용자 API 키를 DB 에 암호화해 저장할 때 쓰는 마스터 키.
  # 이건 서버의 것이라 서버 설정에 둔다.
  security:
    encryption-key: ${LONELYTRACKER_ENCRYPTION_KEY:}

  ai:
    base-url: https://api.openai.com/v1
    # 한 줄짜리 한국어를 JSON 으로 바꾸는 작업이라 상위 모델을 쓸 이유가 없다.
    model: gpt-5.6-luna
    # 기본값이 무한 대기다. 걸지 않으면 API 가 멈췄을 때 우리 스레드가 계속 묶인다.
    connect-timeout: 5s
    read-timeout: 30s
    # 429·5xx 만 재시도한다. 4xx 는 몇 번을 보내도 같은 결과다.
    max-retries: 2

spring:
  application:
    name: lonelytracker-backend

  # .env 를 properties 형식으로 읽어들인다. (배포 환경에서는 .env없이 실제 환경변수를 쓰기 때문)
  # optional이라서 파일이 없어도 앱 자체는 작동됨
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lonelytracker}
    username: ${DB_USERNAME:lonelytracker}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 스키마 변경은 Flyway가 담당한다. db/migration 의 V*.sql 중
  # 아직 적용되지 않은 것만 앱 시작 시 순서대로 실행된다.
  flyway:
    # 이미 schedule 테이블이 있는 기존 DB에 도입하는 중이라 필요하다.
    # 현재 상태를 version 1로 간주하고 V2부터 적용한다. 빈 DB에서는 V1부터 전부 실행된다.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # 스키마를 고치는 주체는 Flyway 하나뿐이어야 한다.
      # validate는 엔티티와 실제 테이블이 어긋나면 기동 시점에 바로 알려준다.
      ddl-auto: validate
    # 이 아래는 Hibernate에 그대로 전달되는 Map이다.
    # 키에 점이 들어가면 YAML 계층으로 오해되므로 [] 로 감싸 한 덩어리임을 명시한다.
    properties:
      # dialect는 지정하지 않는다. JDBC 연결을 보고 Hibernate가 알아서 고르며,
      # 명시하면 HHH90000025 경고가 뜬다.
      "[hibernate.format_sql]": true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  devtools:
    # devtools가 심어두는 개발용 기본값(대표적으로 스택트레이스 노출)을 쓰지 않는다.
    # 자동 재시작 기능 자체는 그대로 동작한다.
    add-properties: false

  web:
    error:
      # 켜두면 예외 스택트레이스가 그대로 API 응답에 실려 나간다.
      # Boot 4에서 server.error.* → spring.web.error.* 로 옮겨졌다.
      include-stacktrace: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # logging.level 도 Map이라 점이 든 로거 이름은 [] 로 감싼다
    "[org.hibernate.SQL]": debug
