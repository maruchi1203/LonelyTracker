spring:
  application:
    name: lonelytracker-backend

  # .env 를 properties 형식으로 읽어들인다. optional: 이라 파일이 없어도 앱은 뜬다
  # (배포 환경에서는 .env 없이 실제 환경변수를 쓰기 때문)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lonelytracker}
    username: ${DB_USERNAME:lonelytracker}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 스키마 변경은 Flyway가 담당한다. db/migration 의 V*.sql 중
  # 아직 적용되지 않은 것만 앱 시작 시 순서대로 실행된다.
  flyway:
    # 이미 schedule 테이블이 있는 기존 DB에 도입하는 중이라 필요하다.
    # 현재 상태를 version 1로 간주하고 V2부터 적용한다. 빈 DB에서는 V1부터 전부 실행된다.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # 스키마를 고치는 주체는 Flyway 하나뿐이어야 한다.
      # validate는 엔티티와 실제 테이블이 어긋나면 기동 시점에 바로 알려준다.
      ddl-auto: validate
    # 이 아래는 Hibernate에 그대로 전달되는 Map이다.
    # 키에 점이 들어가면 YAML 계층으로 오해되므로 [] 로 감싸 한 덩어리임을 명시한다.
    properties:
      # dialect는 지정하지 않는다. JDBC 연결을 보고 Hibernate가 알아서 고르며,
      # 명시하면 HHH90000025 경고가 뜬다.
      "[hibernate.format_sql]": true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  devtools:
    # devtools가 심어두는 개발용 기본값(대표적으로 스택트레이스 노출)을 쓰지 않는다.
    # 자동 재시작 기능 자체는 그대로 동작한다.
    add-properties: false

  web:
    error:
      # 켜두면 예외 스택트레이스가 그대로 API 응답에 실려 나간다.
      # Boot 4에서 server.error.* → spring.web.error.* 로 옮겨졌다.
      include-stacktrace: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # logging.level 도 Map이라 점이 든 로거 이름은 [] 로 감싼다
    "[org.hibernate.SQL]": debug
